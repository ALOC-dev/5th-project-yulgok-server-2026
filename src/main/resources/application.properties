spring.application.name=dorm-match

# spring boot .env?(?? ? ??)
spring.config.import=optional:file:.env[.properties]

# PostgreSQL ??
spring.datasource.url=jdbc:postgresql://localhost:5432/dormmatch
spring.datasource.username=dormmatch
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# kakao
kakao.client-id=${KAKAO_CLIENT_ID}
kakao.client-secret=${KAKAO_CLIENT_SECRET}
kakao.redirect-uri=http://localhost:8080/api/v1/auth/kakao/callback

#security
logging.level.org.springframework.security=DEBUG

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}
